{% extends 'cadastro/base.html' %}

{% block titulo %}Início{% endblock %}

{% block conteudo %}
    <h1>Olá, {{ nome }}!</h1>
    <p>Você tem {{ idade }} anos.</p>

    <h2>Frutas:</h2>
    <ul>
        {% for fruta in frutas %}
            <li>{{ fruta }}</li>
        {% endfor %}
    </ul>
{% endblock %}
